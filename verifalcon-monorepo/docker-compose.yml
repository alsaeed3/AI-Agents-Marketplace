services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_AGENT_REGISTRY_ADDRESS=${NEXT_PUBLIC_AGENT_REGISTRY_ADDRESS}
        - NEXT_PUBLIC_PAYMENT_ROUTER_ADDRESS=${NEXT_PUBLIC_PAYMENT_ROUTER_ADDRESS}
        - NEXT_PUBLIC_PINATA_JWT=${NEXT_PUBLIC_PINATA_JWT}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
